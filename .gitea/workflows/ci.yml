name: CI

on:
  pull_request:
    branches:
      - "v1/**"

concurrency:
  group: "ci ${{ github.ref }}"
  cancel-in-progress: true

jobs:
  python-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry==2.1.2

      - name: Install development dependencies
        shell: bash
        run: |
          poetry install --with dev

      - name: Validate Python entrypoints
        shell: bash
        run: |
          poetry run python -m py_compile $(find scripts src tests -name '*.py' -print)

      - name: Run unit and integration tests
        shell: bash
        run: |
          poetry run pytest tests/unit tests/integration

  podman-runtime-smoke:
    runs-on: ubuntu-latest
    needs: python-validation
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry==2.1.2

      - name: Install development dependencies
        shell: bash
        run: |
          poetry install --with dev

      - name: Verify Podman availability
        shell: bash
        run: |
          podman --version

      - name: Run Podman smoke tests
        shell: bash
        env:
          RUN_PODMAN_TESTS: "1"
        run: |
          poetry run pytest tests/podman -m podman
