name: Auto Changelog & Release

on:
  push:
    branches:
      - "v1/main"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Release
        uses: https://git.0xmax42.io/actions/auto-changelog-release-action@v1.10.0
        with:
          token: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
          allow_non_main_release: "true"
